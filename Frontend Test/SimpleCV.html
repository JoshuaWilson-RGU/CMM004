<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your CV</title>
  <style>
    /* Stylish styling for the CV display page */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    .cv-container {
      max-width: 800px;
      margin: 20px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .cv-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .cv-header h1 {
      margin: 0;
      font-size: 32px;
      color: #333;
    }
    .cv-header p {
      font-size: 16px;
      color: #666;
      margin: 5px 0;
    }
    .cv-section {
      margin-bottom: 20px;
    }
    .cv-section h2 {
      border-bottom: 2px solid #007bff;
      padding-bottom: 5px;
      margin-bottom: 10px;
      color: #007bff;
    }
    .cv-section p {
      line-height: 1.6;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="cv-container">
    <div class="cv-header">
      <h1 id="fullName"></h1>
      <p id="contact"></p>
    </div>
    <div class="cv-section">
      <h2>Professional Summary</h2>
      <p id="summary"></p>
    </div>
    <div class="cv-section">
        <h2>Education</h2>
        <p id="education"></p>
      </div>
    <div class="cv-section">
      <h2>Work Experience</h2>
      <p id="experience"></p>
    </div>
  </div>

  <script>
    // Retrieve the CV details from localStorage and display them.
    const cvDetails = JSON.parse(localStorage.getItem('cvDetails'));
    if (cvDetails) {
      document.getElementById('fullName').innerText = cvDetails.fullName;
      document.getElementById('contact').innerText = cvDetails.email + " | " + cvDetails.phone;
      document.getElementById('summary').innerText = cvDetails.summary;
      document.getElementById('education').innerText = cvDetails.education;
      document.getElementById('experience').innerText = cvDetails.experience;
    } else {
      // If no data is found, redirect back to the input form.
      window.location.href = 'cvindex.html';
    }
  </script>
</body>
</html>
