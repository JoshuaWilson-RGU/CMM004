<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CV Builder</title>
    <link rel="stylesheet" href="bootstrap.css">
  </head>
  <body>
    <div class="container pt-5">
        <div class="row">
            <div class="col-3"></div>
            <div class="col-6">
                <div class="container pt-3 shadow-lg p-3 mb-5 bg-body rounded">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-10">
                            <h3 class="text-center">Enter Your CV Details</h2>
                        </div>
                            <div class="col-1"></div>
                    
                    <form id="cvForm">
                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <label for="fullName" class="form-label fw-bold">Full Name:</label>
                                <input type="text" id="fullName" required class="form-control"/>
                            </div>
                            <div class="col-1"></div>
                        </div>
                
                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <label for="email" class="form-label fw-bold">Email:</label>
                                <input type="email" id="email" required class="form-control"/>
                            </div>
                            <div class="col-1"></div>
                        </div>
                      
                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <label for="phone" class="form-label fw-bold">Phone Number:</label>
                                <input type="tel" id="phone" required class="form-control"/>
                            </div>
                            <div class="col-1"></div>
                        </div>
                
                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <label for="summary" class="form-label fw-bold">Professional Summary:</label>
                                <textarea id="summary" rows="4" required class="form-control"></textarea>
                            </div>
                            <div class="col-1"></div>
                        </div>
                        
                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <label for="education" class="form-label fw-bold">Education:</label>
                                <textarea id="education" rows="4" required class="form-control"></textarea> <br>
                            </div>
                            <div class="col-1"></div>
                        </div>


                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <label for="experience" class="form-label fw-bold">Work Experience:</label>
                                <textarea id="experience" rows="4" required class="form-control"></textarea>
                            </div>
                            <div class="col-1"></div>
                        </div>
                    
                        <br>
                    
                        <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10 d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Submit CV</button>
                            </div>
                            <div class="col-1"></div>
                        </div>
                    </form>
                  </div>
                  </div>


            </div>
            <div class="col-3"></div>

    </div>
    <script>
        // When the form is submitted, prevent default form submission,
        // save the details to localStorage, and navigate to the CV display page.
        document.getElementById('cvForm').addEventListener('submit', function (e) {
          e.preventDefault();
          
          const cvDetails = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            summary: document.getElementById('summary').value,
            education: document.getElementById('education').value,
            experience: document.getElementById('experience').value,
           
          };
    
          // Save CV details in localStorage
          localStorage.setItem('cvDetails', JSON.stringify(cvDetails));
    
          // Redirect to the CV display page
          window.location.href = 'SimpleCV.html';
        });
      </script>
  

  
</body>
</html>
